# Jenkins replaces ECR_IMAGE_PLACEHOLDER with the pushed ECR image before deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simple-app
  template:
    metadata:
      labels:
        app: simple-app
    spec:
      containers:
        - name: simple-app
          image: ECR_IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: simple-app-secret
                  key: APP_SECRET
